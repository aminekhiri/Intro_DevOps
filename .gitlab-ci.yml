# Pipeline TP3 : lint -> test -> build -> scan -> deploy
# Fail fast : les jobs rapides d'abord, un stage ne demarre que si le precedent est vert.
# Aucun secret ici : tout passe par Settings > CI/CD > Variables (voir TP3/README.md).

stages: [lint, test, build, scan, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE/tp3-api
  CHART: TP3/helm/tp3-api

lint:
  stage: lint
  image: node:22-alpine
  script:
    - cd TP3 && npm ci && npm run lint

test:
  stage: test
  image: node:22-alpine
  script:
    - cd TP3 && npm ci && npm test -- --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: TP3/junit.xml

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $IMAGE:$CI_COMMIT_SHA TP3
    - docker push $IMAGE:$CI_COMMIT_SHA

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $IMAGE:$CI_COMMIT_SHA

.deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    # KUBECONFIG et APP_API_KEY : variables CI scopees par environnement
    - >
      helm upgrade --install tp3-api $CHART
      --namespace $K8S_NAMESPACE --create-namespace
      -f $CHART/$VALUES_FILE
      --set image.repository=$IMAGE
      --set image.tag=$CI_COMMIT_SHA
      --set-string secret.apiKey="$APP_API_KEY"
      --set registry.server=$CI_REGISTRY
      --set registry.username="$CI_DEPLOY_USER"
      --set-string registry.password="$CI_DEPLOY_PASSWORD"
      --atomic --wait --timeout 3m

deploy-staging:
  extends: .deploy
  variables:
    K8S_NAMESPACE: tp3-staging
    VALUES_FILE: values-staging.yaml
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-prod:
  extends: .deploy
  variables:
    K8S_NAMESPACE: tp3-prod
    VALUES_FILE: values-prod.yaml
  environment: { name: production }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
