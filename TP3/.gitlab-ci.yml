# Pipeline TP3 (inclus par ../.gitlab-ci.yml) : lint -> test -> build -> scan -> deploy
# Fail fast : les jobs rapides d'abord, un stage ne demarre que si le precedent est vert.
# Aucun secret ici : tout passe par Settings > CI/CD > Variables (voir README.md).

variables:
  TP3_IMAGE: $CI_REGISTRY_IMAGE/tp3-api
  TP3_CHART: TP3/helm/tp3-api

tp3-lint:
  stage: lint
  image: node:22-alpine
  script:
    - cd TP3 && npm ci && npm run lint

tp3-test:
  stage: test
  image: node:22-alpine
  script:
    - cd TP3 && npm ci && npm test -- --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: TP3/junit.xml

tp3-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $TP3_IMAGE:$CI_COMMIT_SHA TP3
    - docker push $TP3_IMAGE:$CI_COMMIT_SHA

tp3-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $TP3_IMAGE:$CI_COMMIT_SHA

.tp3-deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    # KUBECONFIG et APP_API_KEY : variables CI scopees par environnement
    - >
      helm upgrade --install tp3-api $TP3_CHART
      --namespace $K8S_NAMESPACE --create-namespace
      -f $TP3_CHART/$VALUES_FILE
      --set image.repository=$TP3_IMAGE
      --set image.tag=$CI_COMMIT_SHA
      --set-string secret.apiKey="$APP_API_KEY"
      --set registry.server=$CI_REGISTRY
      --set registry.username="$CI_DEPLOY_USER"
      --set-string registry.password="$CI_DEPLOY_PASSWORD"
      --atomic --wait --timeout 3m

tp3-deploy-staging:
  extends: .tp3-deploy
  variables:
    K8S_NAMESPACE: tp3-staging
    VALUES_FILE: values-staging.yaml
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

tp3-deploy-prod:
  extends: .tp3-deploy
  variables:
    K8S_NAMESPACE: tp3-prod
    VALUES_FILE: values-prod.yaml
  environment: { name: production }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
