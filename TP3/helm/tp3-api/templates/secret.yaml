apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tp3-api.name" . }}-secret
  labels: {{- include "tp3-api.labels" . | nindent 4 }}
type: Opaque
data:
  API_KEY: {{ .Values.secret.apiKey | b64enc | quote }}
{{- if .Values.registry.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tp3-api.name" . }}-registry
  labels: {{- include "tp3-api.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" .Values.registry.server (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc) | b64enc | quote }}
{{- end }}
