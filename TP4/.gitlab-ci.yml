# Pipeline TP4 (inclus par ../.gitlab-ci.yml) : lint -> test -> build -> scan -> deploy
# Secrets : uniquement dans Settings > CI/CD > Variables (voir README.md).

variables:
  TP4_IMAGE: $CI_REGISTRY_IMAGE/tp4-api
  TP4_CHART: TP4/helm/tp4-api

# --- Detection de secrets (gitleaks) sur l'historique ---
tp4-gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git . --redact -v

tp4-lint:
  stage: lint
  image: node:22-alpine
  script:
    - cd TP4 && npm ci && npm run lint

tp4-test:
  stage: test
  image: node:22-alpine
  script:
    - cd TP4 && npm ci && npm test -- --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: TP4/junit.xml

# --- SCA : vulnerabilites des dependances (package-lock.json) ---
tp4-sca:
  stage: test
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 TP4

tp4-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $TP4_IMAGE:$CI_COMMIT_SHA TP4
    - docker push $TP4_IMAGE:$CI_COMMIT_SHA

# --- Scan d'image ---
tp4-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $TP4_IMAGE:$CI_COMMIT_SHA

.tp4-deploy:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  script:
    - >
      helm upgrade --install tp4-api $TP4_CHART
      --namespace $K8S_NAMESPACE --create-namespace
      -f $TP4_CHART/$VALUES_FILE
      --set image.repository=$TP4_IMAGE
      --set image.tag=$CI_COMMIT_SHA
      --set-string secret.apiKey="$APP_API_KEY"
      --set registry.server=$CI_REGISTRY
      --set registry.username="$CI_DEPLOY_USER"
      --set-string registry.password="$CI_DEPLOY_PASSWORD"
      --atomic --wait --timeout 3m

tp4-deploy-staging:
  extends: .tp4-deploy
  variables:
    K8S_NAMESPACE: tp4-staging
    VALUES_FILE: values-staging.yaml
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

tp4-deploy-prod:
  extends: .tp4-deploy
  variables:
    K8S_NAMESPACE: tp4-prod
    VALUES_FILE: values-prod.yaml
  environment: { name: production }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
