apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tp4-api.name" . }}
  labels:
    {{- include "tp4-api.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.release }}
spec:
  selector:
    matchLabels: {{- include "tp4-api.labels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
